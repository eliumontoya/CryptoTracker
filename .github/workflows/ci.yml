name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Build
        run: xcodebuild build -scheme "Crypto Tracker" -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO

      - name: Unit Test
        run: xcodebuild test -scheme "Crypto Tracker" -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO -only-testing:'Crypto TrackerTests'
