name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Enable UI Testing
        run: sudo automationmodetool enable-automationmode-without-authentication

      - name: Build
        run: xcodebuild build -scheme "Crypto Tracker" -destination 'platform=macOS'

      - name: Test
        run: xcodebuild test -scheme "Crypto Tracker" -destination 'platform=macOS'
